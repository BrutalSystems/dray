name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    services:
      # A throwaway dev server for the openbao adapter's conformance tests.
      openbao:
        image: quay.io/openbao/openbao:2.7.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-root
        ports:
          - 8200:8200
    env:
      DRAY_TEST_OPENBAO_ADDR: http://127.0.0.1:8200
      DRAY_TEST_OPENBAO_TOKEN: ci-root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: Check every binary reports its version
        run: |
          for f in dist/*/dray dist/*/dray-server; do
            case "$f" in *linux_amd64*) "$f" version ;; esac
          done
