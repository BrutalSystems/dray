# BuildKit for dray-server: builds images in the cluster (rootless, no
# privileged container). Only dray-server pods may reach it (NetworkPolicy);
# an operator can still reach it through `kubectl port-forward`.
#
#   kubectl apply -f deploy/kubernetes/buildkitd.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: dray
  labels:
    dray/app: dray
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: dray
  labels:
    app.kubernetes.io/name: buildkitd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.34.2-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: [buildctl, debug, workers]
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec:
              command: [buildctl, debug, workers]
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: buildkitd
              mountPath: /home/user/.local/share/buildkit
      volumes:
        # The layer cache. It is lost when the pod moves, which costs only time.
        - name: buildkitd
          emptyDir:
            sizeLimit: 40Gi
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: dray
spec:
  selector:
    app.kubernetes.io/name: buildkitd
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd
  namespace: dray
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dray-server
      ports:
        - port: 1234
